<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Files Deduplicator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { max-width: 500px; margin: 0 auto; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="form-container">
    <form action="/api/v1/deduplicator" method="get">
        <div style="display: flex; gap: 10px; align-items: center;">
            <span class="folder-icon">📁</span>
            <input type="file"
                   id="path"
                   name="path"
                   placeholder="Enter path"
                   style="flex: 1;"
                   webkitdirectory
                   required>
            <button type="submit" style="white-space: nowrap;">Submit</button>
        </div>
    </form>
</div>
</body>
</html>
